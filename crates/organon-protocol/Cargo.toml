[package]
name = "organon-protocol"
description = "The shared language of organon organs: Source, Observation, Claim, Proposal, Episode."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[features]
default = []
schema = ["dep:schemars"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "1"
schemars = { version = "0.8", optional = true }

[dev-dependencies]
proptest = "1"

[lints]
workspace = true
