[workspace]
resolver = "2"
members = ["crates/organon-protocol", "crates/organon-protocol-cli"]

[workspace.package]
version = "0.1.1"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/Philipjj609/organon-protocol"
rust-version = "1.80"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
